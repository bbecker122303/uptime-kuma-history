# fly.toml for vue-online-status (Uptime Kuma)
# https://fly.io/docs/reference/configuration/

app = "vue-online-status"
primary_region = "iad"

[build]
  dockerfile = "docker/dockerfile"
  build-target = "release"

[env]
  UPTIME_KUMA_IS_CONTAINER = "1"

[[mounts]]
  source = "uptime_kuma_data"
  destination = "/app/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
